<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1c1a17"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Protein Tracker"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/icon-192.png"><title>Protein Tracker</title>
<style>:root{--bg:#1c1a17;--card:#262320;--line:#3a352f;--wheat:#d9a94f;--dim:#a89f8e;--green:#7a9a5c;--cream:#f2ead9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--cream);font-family:Georgia,serif;padding:20px 16px 48px;max-width:480px;margin:auto}h1{font-size:1.5rem;font-weight:400;margin:4px 0 2px}.date-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.date-nav{display:flex;align-items:center;gap:10px;font:14px -apple-system,sans-serif;color:var(--dim)}button{cursor:pointer}.date-nav button{background:none;border:1px solid var(--line);color:var(--cream);border-radius:6px;width:30px;height:30px;font-size:1rem}.totalWrap,.meal,.stats{background:var(--card);border:1px solid var(--line);border-radius:14px}.totalWrap{padding:18px 20px;margin-bottom:20px;position:relative;overflow:hidden}.barBg,.barFill{position:absolute;left:0;bottom:0;height:4px}.barBg{width:100%;background:var(--line)}.barFill{background:var(--wheat);transition:.4s;width:0}.totalNum{font-size:2.6rem;color:var(--wheat);line-height:1}.totalNum span{font-size:1.1rem;color:var(--dim)}.totalLabel,.mealProtein,.item,.swapNote,.resetRow,.stats{font-family:-apple-system,sans-serif}.totalLabel{font-size:.78rem;color:var(--dim);margin-top:4px}.meal{margin-bottom:12px;overflow:hidden}.mealHead{display:flex;justify-content:space-between;padding:14px 16px 10px}.mealTitle{font-size:1.05rem}.mealProtein{font-size:.85rem;color:#8a6f3a}.items{padding:0 16px 14px}.item{display:flex;gap:10px;padding:7px 0;font-size:.92rem;color:var(--dim);user-select:none}.item.checked{color:var(--cream)}.check{width:19px;height:19px;border-radius:5px;border:1.5px solid #8a6f3a;display:flex;align-items:center;justify-content:center;flex:none}.item.checked .check{background:var(--green);border-color:var(--green)}.check svg{width:12px;opacity:0}.item.checked svg{opacity:1}.itemText{flex:1}.g{color:#8a6f3a;font-size:.83rem}.item.checked .g{color:var(--wheat)}.swapNote{font-size:.78rem;color:var(--dim);opacity:.65;padding:0 16px 12px}.stats{padding:14px 16px;margin-top:18px;color:var(--dim);font-size:.85rem}.stats strong{color:var(--wheat)}.resetRow{text-align:center;margin-top:22px}.resetRow button{background:none;border:0;color:var(--dim);font-size:.8rem;text-decoration:underline}.loading{text-align:center;padding:40px;color:var(--dim);font-family:-apple-system,sans-serif}</style></head>
<body><h1>Protein Tracker</h1><div class="date-row"><div class="date-nav"><button id="prevDay">‹</button><span id="dateLabel">Today</span><button id="nextDay">›</button></div></div><div class="totalWrap"><div class="totalNum" id="totalNum">0<span>g / 120g</span></div><div class="totalLabel" id="totalLabel">Get moving on breakfast</div><div class="barBg"></div><div class="barFill" id="barFill"></div></div><div id="meals"></div><div class="stats" id="stats"></div><div class="resetRow"><button id="resetBtn">Clear this day</button></div>
<script>const GOAL=120;const MEAL_DATA=[{id:'breakfast',title:'Meal 1 — Breakfast',proteinNote:'25–30g protein',items:[{id:'eggs',text:'3 whole eggs + 2 egg whites',g:25},{id:'roti1',text:'2 roti',g:0,swap:'breakfastCarb'},{id:'rice1',text:'or 1/2–3/4 cup rice (swap)',g:0,swap:'breakfastCarb'},{id:'paneer',text:'Veg option: 200g paneer bhurji + 1 roti',g:0}]},{id:'lunch',title:'Meal 2 — Lunch',proteinNote:'25g protein',items:[{id:'rajma',text:'1 cup rajma or chole',g:15},{id:'rice2',text:'1 cup rice + 100g curd',g:10}]},{id:'snack',title:'Meal 3 — Evening Snack',proteinNote:'20g protein',items:[{id:'chana',text:'100g roasted chana or 40g soya chunks',g:17},{id:'banana',text:'1 banana',g:3}]},{id:'dinner',title:'Meal 4 — Dinner',proteinNote:'30g protein',items:[{id:'moong',text:'100g boiled green moong',g:12},{id:'roti2',text:'2 roti + sabzi + salad',g:18,swap:'dinnerCarb'},{id:'rice3',text:'or 3/4–1 cup rice + sabzi + salad (swap)',g:18,swap:'dinnerCarb'}]}];let currentDate=new Date();let checkedState={};const key=d=>'protein-day:'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');const label=d=>{let t=new Date(),k=key(d),tk=key(t),y=new Date(t);y.setDate(y.getDate()-1);if(k===tk)return'Today';if(k===key(y))return'Yesterday';return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})};function load(){checkedState=JSON.parse(localStorage.getItem(key(currentDate))||'{}');render()}function save(){localStorage.setItem(key(currentDate),JSON.stringify(checkedState))}function total(){return MEAL_DATA.flatMap(m=>m.items).reduce((s,i)=>s+(checkedState[i.id]?i.g:0),0)}function streak(){let d=new Date(),n=0;while(true){let s=JSON.parse(localStorage.getItem(key(d))||'{}');let t=MEAL_DATA.flatMap(m=>m.items).reduce((a,i)=>a+(s[i.id]?i.g:0),0);if(t<GOAL)break;n++;d.setDate(d.getDate()-1)}return n}function render(){dateLabel.textContent=label(currentDate);let t=total(),p=Math.min(100,Math.round(t/GOAL*100));totalNum.innerHTML=t+'<span>g / '+GOAL+'g</span>';barFill.style.width=p+'%';totalLabel.textContent=t===0?'Get moving on breakfast':t<GOAL?(GOAL-t)+'g to go':'Goal hit — nice work';meals.innerHTML='';MEAL_DATA.forEach(m=>{let el=document.createElement('div');el.className='meal';el.innerHTML='<div class="mealHead"><div class="mealTitle">'+m.title+'</div><div class="mealProtein">'+m.proteinNote+'</div></div>';let items=document.createElement('div');items.className='items';m.items.forEach(i=>{let r=document.createElement('div');r.className='item'+(checkedState[i.id]?' checked':'');r.innerHTML='<div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#1c1a17" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div><div class="itemText">'+i.text+(i.g?' <span class="g">· '+i.g+'g</span>':'')+'</div>';r.onclick=()=>{if(i.swap){m.items.filter(x=>x.swap===i.swap&&x.id!==i.id).forEach(x=>checkedState[x.id]=false)}checkedState[i.id]=!checkedState[i.id];save();render()};items.appendChild(r)});el.appendChild(items);if(m.id==='breakfast'||m.id==='dinner'){let n=document.createElement('div');n.className='swapNote';n.textContent='Tap either roti or rice — only check the one you actually ate.';el.appendChild(n)}meals.appendChild(el)});stats.innerHTML='<strong>🔥 '+streak()+' day streak</strong> · '+(t>=GOAL?'Daily goal completed':'Keep going — target is '+GOAL+'g')+'<br><br>Weekly history: '+weekBars()}function weekBars(){let out=[],d=new Date(currentDate);d.setDate(d.getDate()-6);for(let i=0;i<7;i++){let s=JSON.parse(localStorage.getItem(key(d))||'{}'),t=MEAL_DATA.flatMap(m=>m.items).reduce((a,x)=>a+(s[x.id]?x.g:0),0);out.push(d.toLocaleDateString('en-US',{weekday:'short'})+': '+t+'g');d.setDate(d.getDate()+1)}return out.join(' · ')}prevDay.onclick=()=>{currentDate.setDate(currentDate.getDate()-1);load()};nextDay.onclick=()=>{currentDate.setDate(currentDate.getDate()+1);load()};resetBtn.onclick=()=>{if(confirm('Clear this day?')){checkedState={};save();render()}};if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js');load();</script></body></html>
